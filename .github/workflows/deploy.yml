name: Deploy material gallery to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - name: Require a merged release PR or a manual main release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            approved=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq "any(.[]; .merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$GITHUB_SHA\")")
            echo "approved=$approved" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: release
    if: needs.release.outputs.approved == 'true'
    uses: ./.github/workflows/verify-online.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Check contracts and publication boundary
        run: npm test
      - name: Build gallery and verify publication boundary
        run: npm run build:public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
