name: Verify browser workbench

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LUSTER_USE_BUNDLED_CHROMIUM: '1'
      LUSTER_FIREFOX_HEADED: ${{ matrix.browser == 'firefox' && '1' || '0' }}
      # Native macOS OpenGL is too slow on this runner; exercise WebGL through ANGLE.
      LUSTER_FIREFOX_ANGLE: ${{ matrix.browser == 'firefox' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: firefox
            os: macos-15
          - browser: webkit
            os: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: runner.os == 'Linux'
      - run: npx playwright install ${{ matrix.browser }}
        if: runner.os == 'macOS'
      - run: npm run test:online -- --browser=${{ matrix.browser }}
      - run: npm run test:public -- --browser=${{ matrix.browser }}
      - run: npm run test:published -- --browser=${{ matrix.browser }}
      - run: npm run test:spectrum -- --browser=${{ matrix.browser }}
