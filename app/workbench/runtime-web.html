<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luster material · Web export prototype</title><style>
:root{font-family:Arial,sans-serif;color:#f5ecd9;background:#1646ce}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid #ffffff77}header strong{font-family:Impact,'Arial Narrow',sans-serif;font-size:30px}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px}canvas{max-width:100%;max-height:calc(100vh - 150px);box-shadow:0 20px 50px #042a8999}footer{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:15px 22px;border-top:1px solid #ffffff77;font-size:13px}label{display:flex;gap:8px;align-items:center}input{accent-color:#f5ecd9}input[type=range]{min-width:180px}
</style></head><body><header><strong>LUSTER</strong><span id="status" role="status">Loading local package…</span></header><main><canvas id="material" aria-label="Exported material preview"></canvas></main><footer><label><input id="original" type="checkbox">Original artwork</label><label><input id="foil" type="checkbox" checked>Foil layer</label><label>View angle <input id="angle" type="range" min="-18" max="18" step="0.1"><output id="angleValue"></output></label></footer><script type="module" src="./runtime-web.js"></script></body></html>
