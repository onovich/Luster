<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luster</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./demo/style.css"><link rel="modulepreload" href="./demo/app.js"><link rel="preload" href="./demo/assets/images/art-orbit.webp" as="image"><link rel="preload" href="./src/shaders/B14.frag" as="fetch" crossorigin></head>
<body data-load="loading"><main>
<header><div class="identity"><h1>Luster</h1></div><nav aria-label="项目链接"><a href="https://github.com/onovich/Luster/blob/main/docs/guide.md">About</a><a href="https://github.com/onovich/Luster">GitHub</a></nav></header>
<div id="stage" aria-label="左右移动倾斜书本"><div id="book">
<img class="book-art book-cobalt" src="./demo/assets/images/book-exhibit.webp" alt="钴蓝绒面卡册，象牙白纸页与四枚金属环" fetchpriority="high" decoding="async">
<span class="cover-copy cover-left" aria-hidden="true">SMALL<br>SHIFTS<br>BRIGHTER<br>WORLDS<br>—</span><span class="cover-copy cover-right" aria-hidden="true">MATERIALS<br>LIGHT<br>PERSPECTIVE<br>PLAY<br>—</span><div id="pockets"></div></div></div>

<div id="albumLoading" role="status" aria-label="材质加载进度"><div><span>Preparing light</span><span id="loadCount">0 / 8</span></div><progress id="loadProgress" max="8" value="0" aria-label="已就绪材质"></progress></div>
<p id="gestureHint" class="hint">左右移动倾斜卡册 · 悬停卡牌向上抽出</p>
<section class="console" aria-label="演示控制">
<div class="toolbar">
<div class="view-switch" role="group" aria-label="View"><button id="view-book" aria-pressed="true">Album</button><button id="view-material" aria-pressed="false">Material</button></div><select id="view" hidden aria-label="View"><option value="book">Album</option><option value="material">Material</option></select>
<label id="pocketLabel" hidden>Sample<select id="pocket"></select></label>

<div class="angle-buttons" role="group" aria-label="材质方案"><button id="left" aria-label="上一方案">‹</button><button id="center" aria-label="切换方案"><span class="angle-dial" aria-hidden="true"></span><span id="schemeName">B14</span></button><button id="right" aria-label="下一方案">›</button></div>
<button id="play" class="auto-toggle" aria-pressed="false">Auto rotate</button>

</div>
<section class="controls primary-controls" aria-label="常用参数" id="primaryControls"></section>
<details id="advanced"><summary>Advanced<span aria-hidden="true" class="chevron"></span></summary>
<div class="advanced-content"><div class="toolbar"><label class="preset">Preset<select id="variant"><option>B14</option><option>B11</option></select></label><button id="restore">Reset</button><label class="reflection">Reflection on<input id="enabled" type="checkbox" role="switch" checked></label></div><section class="controls" aria-label="材质参数" id="controls"></section>
<div class="toolbar comparison" aria-label="对照"><label>检查<select id="inspect"><option value="0">完整</option><option value="1">反光</option><option value="3">法线</option><option value="4">范围</option><option value="5">间距</option></select></label><button id="dwell" aria-pressed="false">停留循环</button><button id="resetLocal">恢复范围</button><button id="uniform">均匀覆膜</button><button id="uniformStructure">关闭关联</button><button id="restoreStructure">恢复关联</button></div>
</div></details></section>
<footer><output id="status" role="status">材质加载 0 / 8</output><button id="retry" hidden>重试加载</button></footer>
</main><script type="module" src="./demo/app.js"></script></body></html>
