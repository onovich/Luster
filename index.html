<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luster</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./demo/style.css"><link rel="modulepreload" href="./demo/app.js"><link rel="preload" href="./demo/assets/images/base-0.webp" as="image"><link rel="preload" href="./src/shaders/B14.frag" as="fetch" crossorigin></head>
<body><main><header><h1>Luster<span> / 镭射覆膜</span></h1><nav><a href="https://github.com/onovich/Luster/blob/main/docs/guide.md">Guide</a><a href="https://github.com/onovich/Luster">GitHub</a></nav></header>
<section class="toolbar" aria-label="演示"><label>方案<select id="variant"><option>B14</option><option>B11</option></select></label><button id="restore">恢复预设</button><label>视图<select id="view"><option value="book">书本</option><option value="material">材质</option></select></label><label id="pocketLabel" hidden>法线<select id="pocket"></select></label><button id="left">−4°</button><button id="center">0°</button><button id="right">+4°</button><button id="play">往返</button><button id="dwell">停留</button></section>
<div id="stage" aria-label="左右移动倾斜书本"><div id="book">
<img class="book-art book-shadow" src="./demo/assets/images/book-shadow.webp" alt="">
<img class="book-art book-cover" src="./demo/assets/images/book-cover.webp" alt="蓝色皮套" fetchpriority="high" decoding="async">
<img class="book-art book-pages" src="./demo/assets/images/book-pages.webp" alt="卡册内页" fetchpriority="high" decoding="async">
<img class="book-art book-ring ring-0" src="./demo/assets/images/book-ring-0.webp" alt="">
<img class="book-art book-ring ring-1" src="./demo/assets/images/book-ring-1.webp" alt="">
<img class="book-art book-ring ring-2" src="./demo/assets/images/book-ring-2.webp" alt="">
<img class="book-art book-ring ring-3" src="./demo/assets/images/book-ring-3.webp" alt="">
<div id="pockets"></div></div></div>
<section class="controls" aria-label="材质参数" id="controls"></section>
<section class="toolbar" aria-label="对照"><label><input id="enabled" type="checkbox" checked>反光</label><label>检查<select id="inspect"><option value="0">完整</option><option value="1">反光</option><option value="3">法线</option><option value="4">范围</option><option value="5">间距</option></select></label><button id="resetLocal">恢复范围</button><button id="uniform">均匀覆膜</button><button id="uniformStructure">关闭关联</button><button id="restoreStructure">恢复关联</button><output id="status" role="status">加载…</output></section>
</main><script type="module" src="./demo/app.js"></script></body></html>
